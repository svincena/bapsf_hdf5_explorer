[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lapd-explorer"
version = "0.1.0"
description = "Desktop exploration and analysis of BaPSF LAPD time-series data"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "numpy>=1.26", "astropy>=6", "scipy>=1.12", "matplotlib>=3.8", "h5py>=3.10", "bapsflib>=2025.3", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lapd-explorer = "lapd_explorer.app:main"

[tool.setuptools.packages.find]
include = ["lapd_explorer*"]

[tool.setuptools.package-data]
lapd_explorer = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
