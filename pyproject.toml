[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bapsf-hdf5-explorer"
version = "0.1.0"
description = "A PyQt6 desktop workbench for BaPSF HDF5 data"
requires-python = ">=3.11"
dependencies = [
  "bapsflib>=2026.4.0,<2027",
  "PyQt6>=6.8,<7",
  "pyqtgraph>=0.13.7,<0.15",
  "numpy>=1.26",
  "xarray>=2024.6",
  "scipy>=1.13",
  "h5netcdf>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
bapsf-explorer = "bapsf_explorer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
